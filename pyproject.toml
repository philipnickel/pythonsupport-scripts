[project]
name = "pythonsupport-scripts-tests"
version = "0.1.0"
description = "Tests for DTU Python Support launcher scripts"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
