[project]
name = "pythonsupport-offline-bundle"
version = "0.1.0"
description = "Build fully offline DTU Python Support installer bundles"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "rich>=14.1.0,<15",
    "typer>=0.16.1,<0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "respx>=0.22.0,<0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
